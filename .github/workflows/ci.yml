name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supabase CLI + local stack so integration specs actually run
      # (instead of describe.skipIf-skipping in headless CI).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        working-directory: .

      - name: Apply migrations + seed
        run: supabase db reset --linked=false --no-seed=false
        working-directory: .

      # Export the local stack's REAL keys for later steps. Current CLI
      # versions issue new-format sb_* keys and no longer honor the legacy
      # demo JWTs this workflow used to hardcode — requests with those landed
      # as an unprivileged role and died with "permission denied for table
      # books" (CI was never green). Reading from `supabase status` also
      # keeps us correct if the CLI rotates key formats again.
      - name: Export local Supabase keys
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; source /tmp/sb.env; set +a
          SECRET="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          PUBLISHABLE="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          if [ -z "$SECRET" ] || [ -z "$PUBLISHABLE" ]; then
            echo "Could not find local Supabase keys. Variables available:"
            cut -d= -f1 /tmp/sb.env
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE"
            echo "SUPABASE_SECRET_KEY=$SECRET"
          } >> "$GITHUB_ENV"

      # Cheap tripwire for the class of failure that kept CI red for its
      # first three days: shows exactly which roles hold grants on books and
      # what PostgREST does with each key, so the next auth/grants drift is
      # a 10-second read instead of an archaeology dig.
      - name: Diagnose DB grants + REST auth
        continue-on-error: true
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; source /tmp/sb.env; set +a
          DB="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          psql "$DB" -c "select grantee, privilege_type from information_schema.table_privileges where table_schema='public' and table_name='books' order by grantee, privilege_type;"
          for K in "$SUPABASE_SECRET_KEY" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; do
            echo "--- REST probe with key ${K:0:18}…"
            curl -s -o /tmp/resp -w "HTTP %{http_code}\n" \
              "http://127.0.0.1:54321/rest/v1/books?select=id&limit=1" \
              -H "apikey: $K" -H "Authorization: Bearer $K"
            cat /tmp/resp; echo
          done

      - name: Import pack-000
        run: pnpm content:import-pack-000

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          CHILD_TOKEN_SECRET: build-time-placeholder-not-secret
          PARENT_PASSWORD: build-time-placeholder-not-secret
