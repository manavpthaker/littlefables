# Household manifest — the Whitehead family, Atlanta.
# Gift household (our godson), not an Etsy order. Metadata only — not read
# at runtime.
#
# NOT YET PROVISIONED. The provisioned_id fields below are placeholder zeros
# because scripts/new-household.ts has not been run for this family. Run it
# first, then paste the printed IDs and magic URL in here — see
# content/households/README.md "Adding a household".
#
#   pnpm exec tsx scripts/new-household.ts \
#     --name "Whitehead Family" \
#     --child "Elijah" \
#     --band 6-8 \
#     --email <parent email> \
#     --parent "<parent name>" \
#     --device-label "Elijah's iPad" \
#     --base-url https://littlefables.app
#
# Until provisioned_id is filled in, `pnpm content:add` cannot infer the
# household from the folder and needs an explicit --household <uuid>.

household:
  slug: whitehead
  name: "Whitehead Family"
  provisioned_id: 00000000-0000-0000-0000-000000000000 # TODO: new-household.ts

child:
  name: "Elijah"
  band: "6-8" # turned 6; Kinley (sister, 9/10) reads alongside
  provisioned_id: 00000000-0000-0000-0000-000000000000 # TODO: new-household.ts

parent:
  display_name: "" # TODO: confirm — story.json uses "Mama" / "Daddy" as placeholders
  email: "" # TODO
  provisioned_id: 00000000-0000-0000-0000-000000000000 # TODO: new-household.ts

device:
  label: "Elijah's iPad"
  magic_url: null # TODO: printed by new-household.ts

books:
  - elijah-goes-first

order:
  # Not an Etsy order — a sixth-birthday gift from his godparents.
  etsy_order_id: null
  intake_at: null
  delivered_at: null
  notes: "Gift book. No intake row — the brief came from Manav directly, with reference photos supplied out of band and deliberately not committed."
