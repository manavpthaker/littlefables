<!-- @dsCard group="Little Fables App" viewport="1120x760" name="Little Fables — full app" subtitle="Kid home, reader, checkpoint, map, Parent Corner, outward" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Little Fables — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../public/icons/icon.svg">
<style>
html,body{height:100%}
#root{height:100%}
body{margin:0;overflow:hidden}
.kit{display:flex;height:100%}
.kit-rail{width:172px;flex:none;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.kit-rail .lf-wordmark{margin:2px 8px 16px}
.kit-nav{display:flex;flex-direction:column;gap:2px}
.kit-nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--paper-deep);font-family:var(--font-sc);font-size:14px;letter-spacing:0.07em;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.kit-nav button:hover{background:rgba(243,235,216,0.1)}
.kit-nav button[data-active="true"]{background:rgba(243,235,216,0.14);color:var(--paper-warm)}
.kit-nav .kit-sep{font-family:var(--font-sc);font-size:11px;letter-spacing:0.12em;color:rgba(243,235,216,0.45);margin:12px 10px 4px}
.kit-stage{flex:1;position:relative;background:var(--paper-deep);overflow:hidden}
.kit-screen{position:absolute;inset:0}
.kit-note{position:absolute;left:14px;bottom:10px;font-family:var(--font-body);font-size:12px;color:rgba(243,235,216,0.5)}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="kid-screens.jsx"></script>
<script type="text/babel" src="parent-screens.jsx"></script>
<script type="text/babel" src="outward-screens.jsx"></script>
<script type="text/babel">
const { Wordmark, Icon } = window.LittleFablesHeritageDS_bdeb10;
const SCREENS=[
 ['kid','KID'],['home','shelf home','home'],['reader','reader','book-open'],['checkpoint','checkpoint','mic'],['map','chapter map','map'],
 ['parent','PARENT'],['corner','parent corner','settings'],
 ['out','OUTWARD'],['outward','buyer surfaces','gift'],
];
function App(){
  const [screen,setScreen]=React.useState(localStorage.getItem('lf-kit-screen')||'home');
  const go=(s)=>{ setScreen(s); try{localStorage.setItem('lf-kit-screen',s);}catch(e){} };
  const K=window;
  return <div className="kit">
    <nav className="kit-rail">
      <Wordmark markSize={30} color="var(--paper)"/>
      <div className="kit-nav">
        {SCREENS.map(s=> s.length===2
          ? <span key={s[0]} className="kit-sep">{s[1]}</span>
          : <button key={s[0]} data-active={screen===s[0]?'true':'false'} onClick={()=>go(s[0])}><Icon name={s[2]} size={17}/>{s[1]}</button>)}
      </div>
      <span className="kit-note">art areas are placeholders —<br/>real spreads drop in</span>
    </nav>
    <main className="kit-stage">
      <div className="kit-screen">
        {screen==='home'?<K.KidHome onOpenBook={()=>go('reader')} tab="shelf" onTab={()=>{}}/>:null}
        {screen==='reader'?<K.KidReader onCheckpoint={()=>go('checkpoint')} onBack={()=>go('home')}/>:null}
        {screen==='checkpoint'?<K.KidCheckpoint onDone={()=>go('map')}/>:null}
        {screen==='map'?<K.KidMap onHome={()=>go('home')}/>:null}
        {screen==='corner'?<K.ParentCorner/>:null}
        {screen==='outward'?<K.Outward/>:null}
      </div>
    </main>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
