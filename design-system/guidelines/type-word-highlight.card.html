<!-- @dsCard group="Type" viewport="700x150" name="Word highlight" subtitle="Current word rides an oxblood wash; upcoming waits at 55%" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.line{font-family:var(--font-body);font-size:28px;line-height:1.55;max-width:640px}.said{color:var(--ink)}.now{background:var(--word-current-bg);border-radius:6px;padding:0 4px;color:var(--ink)}.next{color:var(--ink);opacity:var(--word-upcoming-opacity)}.star{display:inline-block;vertical-align:-2px;margin-left:2px}</style></head><body>
<p class="line"><span class="said">The fox tucked the letter </span><span class="now">beneath</span><span class="next"> his velvet coat and bowed.</span><svg class="star" width="20" height="20" viewBox="0 0 20 20" fill="var(--brass)" aria-hidden="true"><path d="M10 1.5 12.4 7l6 .5-4.6 4 1.4 5.9L10 14.2 4.8 17.4 6.2 11.5 1.6 7.5l6-.5Z"/></svg></p>
<p style="font-family:var(--font-body);font-size:12.5px;color:var(--ink-faint);margin-top:10px">spoken · current · upcoming — star affordance in brass marks a saveable word</p>
</body></html>
