<!-- @dsCard group="Surfaces" viewport="700x240" name="Over-art composition" subtitle="Scrim, capsule, panel, sheet — nothing else sits naked over art" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.art{position:relative;height:150px;border-radius:var(--radius-md);overflow:hidden;background:linear-gradient(160deg,#3A4E63 0%,#2E4B3B 55%,#22301F 100%)}.art::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 70% 20%,rgba(243,235,216,0.18),transparent 60%)}.cap{font-family:var(--font-sc);font-size:11.5px;letter-spacing:.07em;color:var(--ink-soft);text-align:center;margin-top:6px}
.scrim{position:absolute;inset:auto 0 0 0;padding:26px 10px 10px;background:var(--scrim-bottom);z-index:1}.scrim p{color:var(--text-on-art);font-family:var(--font-body);font-size:13px;margin:0}
.caps{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--wash-capsule);backdrop-filter:blur(14px);border:1px solid var(--gilt);border-radius:999px;padding:7px 14px;font-family:var(--font-body);font-size:12.5px;color:var(--ink);z-index:1;white-space:nowrap}
.panel{position:absolute;left:8px;right:8px;bottom:8px;background:var(--wash-panel);border:1px solid var(--ink-faint);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font-body);font-size:12.5px;color:var(--ink);z-index:1}
.sheet{position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--paper);border-top:1px solid var(--ink-faint);z-index:1;padding:10px}.sheet::before{content:"";display:block;height:1px;background:var(--ink-faint);margin-bottom:3px}.sheet::after{content:"";display:block;height:2px;background:var(--ink-faint)}.sheet p{font-family:var(--font-body);font-size:12px;color:var(--ink-soft);margin:8px 0 0}</style></head><body>
<div class="g">
<div><div class="art"><div class="scrim"><p>The river kept her secret.</p></div></div><div class="cap">scrim</div></div>
<div><div class="art"><div class="caps">beneath <svg width="12" height="12" viewBox="0 0 20 20" fill="var(--brass)" aria-hidden="true" style="vertical-align:-1px"><path d="M10 1.5 12.4 7l6 .5-4.6 4 1.4 5.9L10 14.2 4.8 17.4 6.2 11.5 1.6 7.5l6-.5Z"/></svg></div></div><div class="cap">capsule</div></div>
<div><div class="art"><div class="panel">Rosa held the lantern higher.</div></div><div class="cap">panel</div></div>
<div><div class="art"><div class="sheet"><p>What should the fox do?</p></div></div><div class="cap">sheet</div></div>
</div></body></html>
