<!-- @dsCard group="Surfaces" viewport="700x210" name="Lighting & bedtime" subtitle="Stages tint paper only; bedtime is dark walnut, kid-only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:flex;gap:10px}.s{flex:1;border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px;height:120px;display:flex;flex-direction:column;justify-content:space-between}.s .cap{font-family:var(--font-sc);font-size:12px;letter-spacing:.1em}.s p{font-family:var(--font-body);font-size:14px;margin:0}</style></head><body>
<div class="g">
<div class="s" data-lighting="morning" style="background:var(--paper)"><span class="cap" style="color:var(--brass)">morning</span><p style="color:var(--ink)">The kettle sings early.</p></div>
<div class="s" data-lighting="day" style="background:var(--paper)"><span class="cap" style="color:var(--brass)">day</span><p style="color:var(--ink)">The kettle sings early.</p></div>
<div class="s" data-lighting="dusk" style="background:var(--paper)"><span class="cap" style="color:var(--brass)">dusk</span><p style="color:var(--ink)">The kettle sings early.</p></div>
<div class="s" data-bedtime style="background:var(--paper)"><span class="cap" style="color:var(--brass)">bedtime</span><p style="color:var(--ink)">The kettle sings early.</p></div>
</div>
<p style="font-family:var(--font-body);font-size:12.5px;color:var(--ink-faint);margin-top:10px">Ink and pigments never shift. No glow, no theatrical light — antique things just look aged.</p>
</body></html>
