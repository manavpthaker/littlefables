<!-- @dsCard group="Colors" viewport="700x170" name="State palette" subtitle="No state relies on color alone — each pairs motion + earcon" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}.st{display:flex;align-items:center;gap:10px;background:var(--paper-warm);border:1px solid var(--border-card);border-radius:var(--radius-sm);padding:8px 12px}.dot{width:14px;height:14px;border-radius:50%;flex:none}.st b{font-family:var(--font-sc);font-weight:400;font-size:13px;letter-spacing:.06em}.st span{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-body);display:block;line-height:1.2}</style></head><body>
<div class="g">
<div class="st"><div class="dot" style="background:var(--state-listening)"></div><div><b>listening</b><span>navy · still, patient</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-thinking)"></div><div><b>thinking</b><span>sepia · deliberate</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-speaking)"></div><div><b>speaking</b><span>forest · steady</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-painting)"></div><div><b>painting</b><span>brass · warm activity</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-offline);border:1px solid var(--border-ornament)"></div><div><b>offline</b><span>a rest, not an error</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-syncing)"></div><div><b>syncing</b><span>forest 60% · quiet</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-mercy)"></div><div><b>mercy</b><span>brass 40% · never red</span></div></div>
<div class="st"><div class="dot" style="background:var(--state-success)"></div><div><b>success</b><span>forest</span></div></div>
</div></body></html>
