<!-- @dsCard group="Colors" viewport="700x170" name="State Vocabulary" subtitle="One color + motion per system state — recognized anywhere" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:10px;padding:14px;background:var(--paper)}.s{flex:1;text-align:center;font-family:var(--font-ui);font-size:11px;color:var(--ink)}.orb{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}</style></head><body>
<div class="s"><div class="orb" style="background:var(--river);animation:lf-listening var(--dur-breath) var(--ease-drift) infinite"></div><b>listening</b><br>breathing ring</div>
<div class="s"><div class="orb" style="background:var(--dusk);color:#FBF4E6;font-size:16px;letter-spacing:2px"><span style="animation:lf-pulse 1.4s infinite">···</span></div><b>thinking</b><br>drifting dots</div>
<div class="s"><div class="orb" style="background:var(--teal);color:#FBF4E6">▮▯▮</div><b>speaking</b><br>gentle bars</div>
<div class="s"><div class="orb" style="background:linear-gradient(90deg,#E39A32,#EFCE71,#E39A32);background-size:200% 100%;animation:lf-paint 2s linear infinite"></div><b>painting</b><br>shimmer wash</div>
<div class="s"><div class="orb" style="background:var(--bark)"></div><b>offline</b><br>still & calm</div>
<div class="s"><div class="orb" style="background:var(--sage);animation:lf-pulse 2.6s infinite"></div><b>syncing</b><br>slow pulse</div>
<div class="s"><div class="orb" style="background:var(--butter);box-shadow:0 0 18px var(--butter)"></div><b>mercy</b><br>butter glow</div>
</body></html>
