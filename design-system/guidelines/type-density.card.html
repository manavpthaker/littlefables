<!-- @dsCard group="Type" viewport="700x210" name="Density Scales" subtitle="Same tokens, two scales — kid default vs [data-density=parent]" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:14px;padding:14px;background:var(--paper)}.col{flex:1;background:var(--paper-bright);border-radius:14px;padding:14px;color:var(--ink)}.tag{font-family:var(--font-ui);font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}</style></head><body>
<div class="col"><span class="tag">kid (default)</span>
<div style="font-family:var(--font-display);font-size:24px;margin-top:6px">Story time!</div>
<div style="font-family:var(--font-body);font-size:21px">Body 21px, targets 56–64px</div>
<div style="margin-top:10px;display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 28px;background:var(--terracotta);color:#FFF6EA;border-radius:999px;font-family:var(--font-display);font-size:19px">Read to me</div></div>
<div class="col" data-density="parent"><span class="tag">parent density</span>
<div style="font-family:var(--font-display);font-size:20px;margin-top:6px">Story detail</div>
<div style="font-family:var(--font-ui);font-size:15px">Body 15px Inter, targets 36–44px</div>
<div style="margin-top:10px;display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;background:var(--terracotta);color:#FFF6EA;border-radius:8px;font-family:var(--font-ui);font-size:13px;font-weight:600">Approve art</div></div>
</body></html>
