<!-- @dsCard group="Motion" viewport="700x170" name="Motion Names" subtitle="tap 160 · settle 320 · wobble 500 · page 700 · bloom 900 · breath 2600" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:18px;padding:20px 24px;background:var(--paper);font-family:var(--font-ui);font-size:11px;color:var(--ink-soft);align-items:center}.m{display:flex;flex-direction:column;align-items:center;gap:10px}.d{width:64px;height:64px;border-radius:16px}</style></head><body>
<div class="m"><div class="d" style="background:var(--terracotta);animation:lf-bloom var(--dur-bloom) var(--ease-settle) infinite"></div>bloom 900</div>
<div class="m"><div class="d" style="background:var(--marigold);animation:lf-wobble var(--dur-wobble) var(--ease-wobble) infinite"></div>wobble 500</div>
<div class="m"><div class="d" style="background:var(--sage);animation:lf-breath var(--dur-breath) var(--ease-drift) infinite"></div>breath 2600</div>
<div class="m"><div class="d" style="background:var(--river);border-radius:50%;animation:lf-listening var(--dur-breath) var(--ease-drift) infinite"></div>listening</div>
<div class="m"><div class="d" style="background:linear-gradient(90deg,#E39A32,#EFCE71,#E39A32);background-size:200% 100%;animation:lf-paint 2s linear infinite"></div>painting</div>
<div class="m"><div class="d" style="background:radial-gradient(80% 80% at 35% 30%,#8fb0c9,transparent 70%),#c9a06a;animation:lf-develop var(--dur-develop) var(--ease-settle) infinite"></div>develop 1400</div>
<div style="max-width:130px">every animation has a reduced-motion equivalent (fade / static)</div>
</body></html>
