<!-- @dsCard group="Spacing" viewport="700x200" name="Tap targets" subtitle="Primary / standard / minimum per density" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:flex;gap:28px}.den{display:flex;flex-direction:column;gap:8px}.den .cap{font-family:var(--font-sc);font-size:12px;letter-spacing:.1em;color:var(--brass)}.tr{display:flex;gap:10px;align-items:flex-end}.t{background:var(--oxblood-wash);border:1.5px solid var(--oxblood);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:11px;color:var(--oxblood)}</style></head><body>
<div class="g">
<div class="den" data-density="kid"><span class="cap">kid</span><div class="tr"><div class="t" style="width:var(--tap-primary);height:var(--tap-primary)">64</div><div class="t" style="width:var(--tap-standard);height:var(--tap-standard)">56</div><div class="t" style="width:var(--tap-min);height:var(--tap-min)">44</div></div></div>
<div class="den" data-density="parent"><span class="cap">parent</span><div class="tr"><div class="t" style="width:var(--tap-primary);height:var(--tap-primary)">44</div><div class="t" style="width:var(--tap-standard);height:var(--tap-standard)">36</div><div class="t" style="width:var(--tap-min);height:var(--tap-min)">32</div></div></div>
<div class="den" data-density="outward"><span class="cap">outward</span><div class="tr"><div class="t" style="width:var(--tap-primary);height:var(--tap-primary)">48</div><div class="t" style="width:var(--tap-standard);height:var(--tap-standard)">40</div><div class="t" style="width:var(--tap-min);height:var(--tap-min)">36</div></div></div>
</div></body></html>
