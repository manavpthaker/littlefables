<!-- @dsCard group="Colors" viewport="700x200" name="Pigments" subtitle="Six pigments; oxblood is the only action color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sw{border-radius:var(--radius-sm);padding:10px 12px;height:72px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--paper)}.sw b{font-family:var(--font-body);font-weight:500;font-size:14px}.sw span{font-size:12px;opacity:.8;font-family:var(--font-body)}.row2{margin-top:10px}</style></head><body>
<div class="g">
<div class="sw" style="background:var(--oxblood)"><b>--oxblood</b><span>#7D2E2B · primary CTA, always & only</span></div>
<div class="sw" style="background:var(--brass)"><b>--brass</b><span>#A67C3A · gilt, gift moments</span></div>
<div class="sw" style="background:var(--forest)"><b>--forest</b><span>#2E4B3B · trust, delivered</span></div>
</div>
<div class="g row2">
<div class="sw" style="background:var(--gilt)"><b>--gilt</b><span>#B89154 · borders & ornament only</span></div>
<div class="sw" style="background:var(--navy)"><b>--navy</b><span>#233450 · frames, focus ring</span></div>
<div class="sw" style="background:var(--burgundy)"><b>--burgundy</b><span>#5A2229 · rare, ceremonial</span></div>
</div></body></html>
