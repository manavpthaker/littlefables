<!-- @dsCard group="Surfaces" viewport="700x190" name="Elevation" subtitle="Paper on paper — one warm sepia shadow, press settles inward" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:flex;gap:14px}.c{flex:1;background:var(--paper-warm);border:1px solid var(--border-card);border-radius:var(--radius-md);height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-body)}.c b{font-weight:500;font-size:14px}.c span{font-size:11.5px;color:var(--ink-faint)}</style></head><body>
<div class="g">
<div class="c" style="box-shadow:var(--shadow-rest)"><b>rest</b><span>none</span></div>
<div class="c" style="box-shadow:var(--shadow-card)"><b>card</b><span>edge line + drop</span></div>
<div class="c" style="box-shadow:var(--shadow-raised)"><b>raised</b><span>4/8 sepia</span></div>
<div class="c" style="box-shadow:var(--shadow-float)"><b>float</b><span>8/16 sepia</span></div>
<div class="c" style="box-shadow:var(--shadow-press)"><b>press</b><span>settles, never vanishes</span></div>
</div></body></html>
