<!-- @dsCard group="Elevation" viewport="700x170" name="Colored Shadows" subtitle="Nothing casts gray — cool by day, warm at dusk" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:20px;padding:22px 24px;background:var(--paper);font-family:var(--font-ui);font-size:11px;color:var(--ink-soft)}.e{display:flex;flex-direction:column;align-items:center;gap:10px}.c{width:88px;height:88px;background:var(--paper-bright);border-radius:16px}</style></head><body>
<div class="e"><div class="c" style="box-shadow:var(--elev-rest)"></div>rest</div>
<div class="e"><div class="c" style="box-shadow:var(--elev-card)"></div>card</div>
<div class="e"><div class="c" style="box-shadow:var(--elev-raised)"></div>raised</div>
<div class="e"><div class="c" style="box-shadow:var(--elev-float)"></div>float</div>
<div class="e"><div class="c" style="box-shadow:0 8px 24px var(--shadow-warm)"></div>warm (dusk)</div>
<div class="e"><div class="c" style="box-shadow:var(--inset-well);background:var(--paper-deep)"></div>well (inset)</div>
</body></html>
