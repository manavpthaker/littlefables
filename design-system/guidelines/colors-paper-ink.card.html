<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sw{border-radius:var(--radius-sm);border:1px solid var(--border-card);padding:10px 12px;height:72px;display:flex;flex-direction:column;justify-content:flex-end}.sw b{font-family:var(--font-body);font-weight:500;font-size:14px}.sw span{font-size:12px;opacity:.75;font-family:var(--font-body)}.row2{margin-top:10px}</style></head><body>
<div class="g">
<div class="sw" style="background:var(--paper)"><b>--paper</b><span>#EDE3CE · base, foxed ivory</span></div>
<div class="sw" style="background:var(--paper-warm)"><b>--paper-warm</b><span>#F3EBD8 · fresh page, CTA cards</span></div>
<div class="sw" style="background:var(--paper-deep)"><b>--paper-deep</b><span>#D9C7A2 · sunken panels</span></div>
</div>
<div class="g row2">
<div class="sw" style="background:var(--ink);color:var(--paper)"><b>--ink</b><span>#2A1D12 · type & strokes</span></div>
<div class="sw" style="background:var(--ink-soft);color:var(--paper)"><b>--ink-soft</b><span>#57432E · secondary, sepia</span></div>
<div class="sw" style="background:var(--ink-faint);color:var(--paper)"><b>--ink-faint</b><span>#8A7156 · rules, never meaning</span></div>
</div></body></html>
