</style></head><body data-density="parent">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { LifecycleChip, QARecord, ComprehensionProfile, CheckpointTranscript, ChoiceRecord, ListRow, Field, TextInput, SectionHeader, ParentTabs, ArtApproval, RetellingPlayer } = window.LittleFablesHeritageDS_bdeb10;
function Demo(){ return (<div className="demo">
  <ParentTabs tabs={[{id:'t',label:'Tonight'},{id:'o',label:'Orders'},{id:'s',label:'Settings'}]} activeId="t"/>
  <div className="demo-row">{['draft','checking','published','needsReview','blocked'].map(s=><LifecycleChip key={s} state={s}/>)}</div>
  <div className="demo-row" style={{alignItems:'flex-start'}}>
    <div style={{flex:1,minWidth:300}}>
      <SectionHeader label="tonight's reading"/>
      <CheckpointTranscript title="Chapter three checkpoints" date="April 12" records={[{question:'Why did Rosa hide the lantern?',answer:"So the crow wouldn't see the light.",meta:'first try · 7:42pm'},{question:'What was in the letter?',answer:'A map to the crossing.',meta:'after a hint · 7:48pm'}]}/>
      <div style={{marginTop:14}}><ChoiceRecord where="at the river crossing" chose="Chose to help the crow" alternative="Cross alone"/></div>
    </div>
    <div style={{flex:1,minWidth:280,display:'flex',flexDirection:'column',gap:16}}>
      <SectionHeader label="comprehension"/>
      <ComprehensionProfile skills={[{label:'Sequence',level:0.8,word:'steady'},{label:'Why & because',level:0.55,word:'growing'},{label:'New words',level:0.7,word:'steady'}]}/>
      <RetellingPlayer progress={0.4} duration="1:12"/>
      <Field label="child's name" help="Used on the cover and in the story."><TextInput value="Rosa"/></Field>
    </div>
  </div>
  <ArtApproval title="Cover — Rosa and the lantern" note="Style: lantern-lit watercolor · spread two of ten" state="needsReview"/>
  <div><ListRow icon="motif-moon" label="Bedtime mode" sub="Dark walnut after seven" value="7:00 pm"/><ListRow icon="volume-2" label="Narration voice" value="Warm & low"/></div>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
