<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:18px}
.demo{display:flex;flex-direction:column;gap:16px}
.demo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.demo-cap{font-family:var(--font-sc);font-size:12px;letter-spacing:0.09em;color:var(--brass);margin-bottom:-6px}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { BookCard, Shelf, Buddy, Transport, MicOrb, ContinueCard, WordCapsule, TabBar, WordJar } = window.LittleFablesHeritageDS_bdeb10;
function Demo(){ return (<div className="demo">
  <div className="demo-row" style={{alignItems:'flex-start'}}>
    <div style={{flex:'1 1 340px'}}><Shelf label="rosa's shelf">
      <BookCard title="The Paper Boat" childName="Rosa" progress={0.4} utterance="Shall we go back to the river?"/>
      <BookCard title="The Winter Key" childName="Rosa" isNew utterance="A brand new story!"/>
    </Shelf></div>
    <div style={{display:'flex',flexDirection:'column',gap:14,alignItems:'center'}}>
      <Buddy state="listening" say="Which way should the fox go?"/>
      <WordJar words={['beneath','velvet','lantern']} countLabel="three words"/>
    </div>
  </div>
  <div className="demo-row"><ContinueCard title="The Paper Boat" chapterLabel="chapter three · the river" progress={0.62} utterance="Shall we keep going?"/></div>
  <div className="demo-row" style={{alignItems:'center',gap:20}}><Transport playing label="page four"/><MicOrb state="listening"/><WordCapsule word="beneath" utterance="Beneath. Under something."/></div>
  <div style={{border:'1px solid var(--border-soft)',borderRadius:'var(--radius-md)',overflow:'hidden'}}><TabBar activeId="shelf" items={[{id:'shelf',label:'shelf',icon:'book-open'},{id:'words',label:'words',icon:'bookmark'},{id:'suns',label:'suns',icon:'motif-sun'}]}/></div>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
