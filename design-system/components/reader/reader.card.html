<style>body{padding:18px}

</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel">
const { StoryText, Checkpoint, ChoiceBlocks, ChapterMap, Sheet, ReaderTopBar, StorySpine, PaintingWash } = window.LittleFablesHeritageDS_bdeb10;
function Demo(){ return (<div className="demo">
  <div style={{position:'relative',borderRadius:'var(--radius-md)',overflow:'hidden',background:'linear-gradient(160deg,#3A4E63,#2E4B3B 60%,#22301F)'}}>

    </div>
  </div>
  <div className="demo-row" style={{alignItems:'flex-start'}}>

      <ChoiceBlocks choices={[{id:'a',label:'To keep it safe'},{id:'b',label:'To trick the crow'}]} pickedId="a"/>
    </Checkpoint>
    <div style={{flex:1,minWidth:220,display:'flex',flexDirection:'column',gap:14}}>
      <PaintingWash height={130}/>
      <Sheet title="What should the fox do?" style={{boxShadow:'var(--shadow-card)'}}><ChoiceBlocks choices={[{id:'x',label:'Help the crow'},{id:'y',label:'Cross alone'}]}/></Sheet>

  </div>

</div>); }
