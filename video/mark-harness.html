<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Little Fables logomark — animation harness</title>
<style>
:root{
  --ink:#192225; --paper:#f6f4ef; --line:#dfd9cd; --muted:#6d7378; --accent:#c8632f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
header{padding:44px 40px 20px;max-width:1180px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;font-weight:650}
header p{margin:0;color:var(--muted);max-width:62ch}
.bar{max-width:1180px;margin:14px auto 0;padding:0 40px;display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:13.5px;padding:7px 15px;border:1px solid var(--line);
  background:#fff;border-radius:999px;cursor:pointer;color:var(--ink)}
button:hover{border-color:#bdb5a5}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{max-width:1180px;margin:26px auto 70px;padding:0 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;text-align:center}
.tile .stage{aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.tile svg{width:100%;height:auto;display:block}
.tile h2{font-size:13.5px;margin:10px 0 2px;font-weight:650;letter-spacing:.01em}
.tile code{font-size:11.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tile.dark{background:#161c1f;border-color:#2b3438}
.tile.dark svg{--lf-ink:#f3efe6}
.tile.dark h2{color:#f3efe6}.tile.dark code{color:#8d979c}

/* ============================================================
   1 · BLOOM  — rays open from the top centre outward, tree fades up
   ============================================================ */
.bloom.run .mark-ray{
  animation:rayIn .62s cubic-bezier(.22,1,.32,1) both;
  animation-delay:calc(var(--d) * .55s);
}
.bloom.run .mark-tree,.bloom.run .mark-roots{
  animation:treeIn .8s cubic-bezier(.22,1,.32,1) both;
}
@keyframes rayIn{from{opacity:0;transform:scale(.42)}to{opacity:1;transform:none}}
@keyframes treeIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* ============================================================
   2 · BURST — rays fly out from the halo centre, one sweep L→R
   uses .from-halo to move the origin to the halo centre
   ============================================================ */
.burst.run .mark-ray{
  transform-origin:var(--halo-cx) var(--halo-cy);
  animation:rayBurst .7s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(var(--i) * 14ms);
}
@keyframes rayBurst{from{opacity:0;transform:scale(.55) rotate(-6deg)}to{opacity:1;transform:none}}
.burst.run .mark-leaf{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:calc(.35s + var(--i) * 60ms)}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}

/* ============================================================
   3 · GROW — the real one. Masked stroke-dashoffset draw-on.
   trunk → branches → leaves, roots reaching down in parallel.
   ============================================================ */
.grow .mark-trunk,.grow .mark-branches,.grow .mark-roots{mask:url(#GROW-grow)}
/* mask the woody parts only — leaves are not on a guide, they pop in separately */
.gm{stroke-dasharray:100;stroke-dashoffset:100}
.grow.run .gm-trunk {animation:draw .85s ease-out both}
.grow.run .gm-branch{animation:draw .55s ease-out both;
  animation-delay:calc(.62s + var(--i) * 70ms)}
.grow.run .gm-root  {animation:draw .70s ease-out both;
  animation-delay:calc(.15s + var(--d) * .45s)}
@keyframes draw{to{stroke-dashoffset:0}}
.grow.run .mark-leaf{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:calc(1.15s + var(--i) * 70ms)}
.grow.run .mark-ray{animation:rayIn .5s cubic-bezier(.22,1,.32,1) both;
  animation-delay:calc(1.3s + var(--d) * .5s)}

/* ============================================================
   4 · BREATHE — idle loop. Halo shimmers as a travelling wave,
   leaves sway, whole mark drifts. Safe to leave running.
   ============================================================ */
.breathe .mark-ray{animation:shimmer 4.2s ease-in-out infinite;
  animation-delay:calc(var(--i) * -110ms)}
@keyframes shimmer{0%,100%{opacity:.55}45%{opacity:1}}
.breathe .mark-leaf{animation:sway 5s ease-in-out infinite;
  animation-delay:calc(var(--i) * -.4s)}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.breathe .mark-tree{animation:drift 7s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ============================================================
   5 · ROOTS — roots reach outward from the trunk, L→R sweep
   ============================================================ */
.roots.run .mark-root{animation:reach .7s cubic-bezier(.22,1,.32,1) both;
  animation-delay:calc(var(--i) * 55ms)}
@keyframes reach{from{opacity:0;transform:scale(.15)}to{opacity:1;transform:none}}
.roots.run .mark-tree{animation:treeIn .6s ease-out both}
.roots .mark-root{transform-origin:var(--ox) var(--oy)}

/* ============================================================
   6 · HOVER — the one you'd actually ship on a nav logo
   ============================================================ */
.hover-demo svg *{transition:none}
.hover-demo .stage:hover .mark-ray{animation:nudge .55s ease-out both;
  animation-delay:calc(var(--d) * .18s)}
@keyframes nudge{50%{transform:scale(1.07)}}
.hover-demo .stage:hover .mark-leaf{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:calc(var(--i) * 45ms)}
.hover-demo .stage{cursor:pointer}

@media (prefers-reduced-motion:reduce){
  .grid *{animation:none!important;transition:none!important}
  .grow .mark-trunk,.grow .mark-branches,.grow .mark-roots{mask:none}
}
</style></head><body>

<header>
  <h1>Little Fables logomark — animation harness</h1>
  <p>One structural SVG, six CSS treatments. Every element carries <code>--i</code> (sequence),
     <code>--d</code> (0 at centre → 1 at the edges) and <code>--ox/--oy</code> (its own growth
     origin), so each of these is a handful of lines of CSS with no JavaScript keyframing.</p>
</header>
<div class="bar">
  <button id="replay" class="on">Replay entrance animations</button>
  <button id="ink">Toggle dark tiles</button>
</div>

<template id="lf-tpl">
<svg xmlns="http://www.w3.org/2000/svg" id="lf-mark" class="lf-mark" viewBox="0 0 1200 1200" role="img"
     aria-labelledby="lf-mark-title" fill="currentColor" style="color:var(--lf-ink,#192225)"
     data-halo-cx="597.8" data-halo-cy="459.2" data-halo-r="333.6"
     data-base-x="585.8" data-base-y="912.8">
  <title id="lf-mark-title">Little Fables</title>

  <style>
  /* ------------------------------------------------------------------
     Animation contract. No animation ships in this file - these are
     inert geometry hooks. Every animatable element carries:

       --i        sequence index within its group (0 based)
       --d        0 at the centre of the group, 1 at its outer edges,
                  for symmetric stagger: animation-delay: calc(var(--d)*.5s)
       --ox/--oy  the point the element grows out of, in viewBox px:
                  the inner end of a ray, the fork a branch leaves,
                  the stem of a leaf, where a root exits the trunk.
       --a        rays only: true angle, 0deg = 12 o'clock, clockwise.

     Group level vars live on .lf-mark: --halo-cx, --halo-cy, --halo-r,
     --base-x, --base-y (the foot of the trunk).

     transform-origin defaults to var(--ox) var(--oy). Add class
     "from-halo" to pivot on the halo centre, or "from-base" to pivot
     on the trunk base instead.

     Sibling parts overlap by a couple of px where they meet, so the
     union is seamless. Do not animate a single part to a partial
     opacity - the overlap will read as a darker seam. Fade whole
     groups, or fade parts from 0 to 1.
     ------------------------------------------------------------------ */
    .lf-mark{--halo-cx:597.8px;--halo-cy:459.2px;--halo-r:333.6px;
             --base-x:585.8px;--base-y:912.8px}
    .lf-mark .mark-ray,.lf-mark .mark-branch,.lf-mark .mark-leaf,
    .lf-mark .mark-root,.lf-mark .mark-trunk{
      transform-box:view-box;transform-origin:var(--ox) var(--oy)}
    .lf-mark .from-halo{transform-origin:var(--halo-cx) var(--halo-cy)}
    .lf-mark .from-base{transform-origin:var(--base-x) var(--base-y)}
  </style>

<div class="grid" id="grid"></div>

<script>
const TILES = [
  {ns:'BLOOM',  cls:'bloom',  name:'Bloom',   sub:'rays open from centre out'},
  {ns:'BURST',  cls:'burst',  name:'Burst',   sub:'rays scale from halo centre'},
  {ns:'GROW',   cls:'grow',   name:'Grow',    sub:'masked draw-on via guides'},
  {ns:'ROOTS',  cls:'roots',  name:'Take root', sub:'roots reach outward'},
  {ns:'BREATHE',cls:'breathe',name:'Breathe', sub:'idle loop, always on'},
  {ns:'HOVER',  cls:'hover-demo', name:'Hover', sub:'nav-logo interaction'},
];
const tpl = document.getElementById('lf-tpl');

function instance(ns, withMask){
  const n = tpl.content.firstElementChild.cloneNode(true);
  if (withMask) buildMask(n);
  n.querySelectorAll('[id]').forEach(el => el.id = ns + '-' + el.id);
  n.querySelectorAll('*').forEach(el => {
    ['href','xlink:href','mask','clip-path','fill','filter'].forEach(a => {
      const v = el.getAttribute(a); if(!v) return;
      if (v[0] === '#') el.setAttribute(a, '#'+ns+'-'+v.slice(1));
      else if (v.startsWith('url(#')) el.setAttribute(a, 'url(#'+ns+'-'+v.slice(5));
    });
  });
  n.id = ns;
  return n;
}

// build <mask id="grow"> out of the centreline guides shipped in <defs>
function buildMask(svg){
  const NS='http://www.w3.org/2000/svg';
  const m = document.createElementNS(NS,'mask');
  m.setAttribute('id','grow');
  m.setAttribute('maskUnits','userSpaceOnUse');
  m.setAttribute('x',0); m.setAttribute('y',0);
  m.setAttribute('width',1200); m.setAttribute('height',1200);
  const add = (href, cls, i, d) => {
    const u = document.createElementNS(NS,'use');
    u.setAttribute('href', href);
    u.setAttribute('class','gm '+cls);
    u.setAttribute('stroke','#fff');
    if(i!=null) u.style.setProperty('--i', i);
    if(d!=null) u.style.setProperty('--d', d);
    m.appendChild(u);
  };
  add('#guide-trunk','gm-trunk');
  svg.querySelectorAll('.guide-branch').forEach((g,i)=>add('#'+g.id,'gm-branch',i));
  svg.querySelectorAll('.guide-root').forEach((g,i)=>{
    const src = svg.querySelector('.mark-root[data-i="'+g.dataset.i+'"]');
    add('#'+g.id,'gm-root',i, src ? src.style.getPropertyValue('--d') : 0);
  });
  svg.querySelector('defs').appendChild(m);
}

const grid = document.getElementById('grid');
TILES.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tile ' + t.cls;
  el.innerHTML = '<div class="stage"></div><h2>'+t.name+'</h2><code>'+t.sub+'</code>';
  el.querySelector('.stage').appendChild(instance(t.ns, t.cls==='grow'));
  grid.appendChild(el);
});

function replay(){
  document.querySelectorAll('.tile').forEach(t=>{
    t.classList.remove('run'); void t.offsetWidth; t.classList.add('run');
  });
}
document.getElementById('replay').onclick = replay;
document.getElementById('ink').onclick = e => {
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('dark'));
  e.target.classList.toggle('on');
};
replay();
</script>
