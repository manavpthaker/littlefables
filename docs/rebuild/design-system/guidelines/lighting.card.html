<!-- @dsCard group="Brand" viewport="700x180" name="Clock Lighting" subtitle="Ambient paper tint shifts with time of day — ink & pigments never change" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:10px;padding:14px;background:#fff}.l{flex:1;border-radius:14px;padding:12px;font-family:var(--font-ui);font-size:11px;color:var(--ink)}.l b{font-family:var(--font-display);font-size:15px;display:block;margin-bottom:4px}.chip{margin-top:26px;background:var(--paper-bright);border-radius:8px;padding:6px 8px;box-shadow:var(--elev-card);font-family:var(--font-body);font-size:12px}</style></head><body>
<div class="l" data-lighting="morning" style="background:var(--paper)"><b>morning</b>cool glow<div class="chip">shadow: cool</div></div>
<div class="l" data-lighting="day" style="background:var(--paper)"><b>day</b>neutral paper<div class="chip">shadow: cool</div></div>
<div class="l" data-lighting="dusk" style="background:var(--paper)"><b>dusk</b>lamplight pools<div class="chip" style="box-shadow:0 3px 10px var(--shadow-warm)">shadow: warm</div></div>
<div class="l" data-lighting="night" style="background:var(--paper)"><b>night</b>quiet, plum glow<div class="chip" style="box-shadow:0 3px 10px var(--shadow-warm)">shadow: warm</div></div>
</body></html>
