<!-- @dsCard group="Brand" viewport="700x170" name="Over-Art Overlays" subtitle="Scrims, wash capsules, paper panel — nothing sits naked over art" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:12px;padding:14px;background:var(--paper)}.art{flex:1;border-radius:14px;position:relative;overflow:hidden;height:130px;background:radial-gradient(80% 90% at 30% 20%,#8fb0c9,transparent 70%),radial-gradient(70% 80% at 80% 70%,#c9a06a,transparent 70%),#a8b89a}.cap{font-family:var(--font-ui);font-size:11px}</style></head><body>
<div class="art"><div style="position:absolute;inset:auto 0 0 0;height:70%;background:var(--scrim-bottom)"></div><div style="position:absolute;bottom:8px;left:10px;color:var(--text-on-art);font-family:var(--font-ui);font-size:12px">scrim-bottom · text-on-art</div></div>
<div class="art"><div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--wash-capsule);backdrop-filter:blur(14px);border-radius:999px;padding:8px 16px;box-shadow:var(--elev-card);font-family:var(--font-ui);font-size:12px;color:var(--ink);white-space:nowrap">wash capsule ▶</div></div>
<div class="art"><div style="position:absolute;inset:auto 8px 8px 8px;background:var(--wash-panel);border-radius:12px;padding:8px 10px;font-family:var(--font-body);font-size:14px;color:var(--ink)">wash panel — reading text over any art</div></div>
</body></html>
